[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinfoundation"
version = "1.0.0"
description = "Proteina with variable-length generative modeling"
requires-python = "==3.11.*"
dependencies = [
    "biotite==0.41.0",
    "torch==2.4.1+cu124",
    "torch-geometric==2.6.1",
    "torch-sparse==0.6.18+pt24cu124",
    "torch-scatter==2.1.2+pt24cu124",
    "torch-cluster==1.6.3+pt24cu124",
    "transformers==4.48.3",
    "python-dotenv==1.0.1",
    "einops==0.6.0",
    "dm-tree==0.1.8",
    "lightning==2.5.0",
    "pytorch-lightning==2.5.0",
    "loguru==0.7.2",
    "hydra-core==1.3.1",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "biopandas==0.5.1",
    "wandb==0.19.11",
    "wget==3.2",
    "tqdm==4.66.4",
    "ml-collections==0.1.1",
    "jaxtyping==0.3.3",
    "cpdb-protein==0.2.0",
    "foldcomp==1.0.0",
    "loralib==0.1.2",
    "biopython==1.85",
    "scipy",
    "huggingface-hub<1",
]

# Use the upstream CUDA/PyG stack on both hosts (Linux x86_64).
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_scatter-2.1.2%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_sparse-0.6.18%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-2.4.0%2Bcu124/torch_cluster-1.6.3%2Bpt24cu124-cp311-cp311-linux_x86_64.whl" }
