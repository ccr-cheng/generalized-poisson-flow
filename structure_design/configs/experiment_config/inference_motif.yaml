ckpt_path: store/ckpts/structure_design/
ckpt_name: motif_1M.ckpt

ncpus: 24
seed: 42

# Total number of flexible-length scaffolds
nsamples: 1000
# Maximum number of samples in each batch
max_nsamples_per_batch: 16
# Stop further insertions once a sample reaches this length (one step can overshoot)
max_length: 384

motif_task_name: "1bcf"
contig_string:
motif_pdb_path: "motif_data/design25/${motif_task_name}.pdb"
motif_only: True #False
run_name: motif1m_sc_inpaint/${motif_task_name}

# Sampling
dt: 0.0025
self_cond: True

# Sampling params only for CAFlow
sampling_caflow:
  sampling_mode: sc  # Options are: vf (plain fow matching) or sc (using score, where parameters below matter)
  sc_scale_noise: 0.35  # scale used to multiply noise if mode == sc
  sc_scale_score: 1.0  # scale used to multiply score if mode == sc, not implemented yet
  gt_mode: "1/t"  # us, tan, or 1/t
  gt_p: 1.0  # float
  gt_clamp_val: null  # 10.0 float or null
  scale_rate: 0.6
  tau_leap: False  # Allow multiple Poisson insertions per gap and step

schedule:
  schedule_mode: log
  schedule_p: 2.0
  schedule_edit_mode: early_uniform
  schedule_edit_p: 0.3  # No insertion after p

# Autoguidance: x_pred = w * x_pred + (1 - w) * x_pred_auxiliary
guidance_weight: 1.0  # 1.0 disables autoguidance
autoguidance_ckpt_path: null  # Required when guidance_weight != 1.0


# Designability
designability_seqs_per_struct: 8
compute_designability: False

# FID-related metrics
compute_fid: False
